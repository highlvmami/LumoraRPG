# The free Render server falls asleep after 15 minutes without visitors and
# then needs about a minute to wake up, so the first sign-in feels slow.
# A visit every 10 minutes keeps it awake (one free service fits in Render's
# 750 free hours a month).
name: Keep the online server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the server
        run: curl -fsS --max-time 90 --retry 2 https://lumora-online.onrender.com/ || true
