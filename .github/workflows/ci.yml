name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: 4.5.1-stable

jobs:
  godot:
    name: Godot smoke test and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" "$RUNNER_TEMP/godot"
          rm godot.zip

      - name: Import project
        run: |
          "$RUNNER_TEMP/godot" --headless --path . --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log

      - name: Run smoke test
        run: |
          timeout 120 "$RUNNER_TEMP/godot" --headless --path . -s res://tests/smoke_test.gd 2>&1 | tee test.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" test.log

      - name: Test the online server and live co-op
        run: |
          (cd server && npm ci --omit=dev && node test.js)
          timeout 120 "$RUNNER_TEMP/godot" --headless --path . -s res://tests/coop_test.gd 2>&1 | tee coop.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" coop.log
          grep -q "all checks passed" coop.log

      - name: Install web and Windows export templates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$dest"
          unzip -j -q templates.tpz "templates/web_nothreads_release.zip" "templates/web_nothreads_debug.zip" "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/version.txt" -d "$dest"
          rm templates.tpz
          # Use the slim web template (see web-template.yml) when it has been built.
          if gh release download "web-template-${GODOT_VERSION%-stable}" -p web_nothreads_release.zip -D slim 2>/dev/null; then
            cp slim/web_nothreads_release.zip "$dest/web_nothreads_release.zip"
            echo "Using the slim web template"
          else
            echo "Slim web template not built yet; using the official one"
          fi
          ls -la "$dest"

      - name: Stamp build number
        run: |
          echo "${GITHUB_RUN_NUMBER}|${GODOT_VERSION%-stable}" > version.txt
          cat version.txt

      - name: Export for web
        run: |
          mkdir -p build/web
          "$RUNNER_TEMP/godot" --headless --path . --export-release "Web" build/web/index.html 2>&1 | tee export.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" export.log
          test -f build/web/index.html
          test -f build/web/index.pck
          ls -la build/web

      - name: Check the web build starts in Chrome
        run: |
          (cd build/web && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          timeout 45 google-chrome --headless=new --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader \
            --enable-logging=stderr --v=0 --user-data-dir="$RUNNER_TEMP/chrome" http://localhost:8000/index.html 2> chrome.log || true
          grep -E "CONSOLE|Godot|ERROR" chrome.log | head -40 || true
          grep -q "Godot Engine v" chrome.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Couldn't load project data" chrome.log

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Export for Windows
        run: |
          mkdir -p build/windows
          "$RUNNER_TEMP/godot" --headless --path . --export-release "Windows Desktop" build/windows/LumoraRPG.exe 2>&1 | tee export-win.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" export-win.log
          test -f build/windows/LumoraRPG.exe
          (cd build/windows && zip -q -9 ../LumoraRPG-windows.zip LumoraRPG.exe)
          # The game alone (no engine) for the exe's self-update.
          "$RUNNER_TEMP/godot" --headless --path . --export-pack "Windows Desktop" build/game.pck 2>&1 | tee export-pck.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" export-pck.log
          cp version.txt build/version.txt
          ls -la build build/windows

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LumoraRPG-windows
          path: |
            build/LumoraRPG-windows.zip
            build/game.pck
            build/version.txt
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: godot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish Windows download
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: godot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LumoraRPG-windows
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LumoraRPG-windows.zip game.pck version.txt --target "$GITHUB_SHA" --title "LumoraRPG (Windows, son sürüm)" --notes "main dalının son hali. Zip'i aç, LumoraRPG.exe'ye çift tıkla. Windows uyarı verirse: Daha fazla bilgi → Yine de çalıştır. Oyun açılırken kendini otomatik günceller."
